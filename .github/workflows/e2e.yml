name: E2E & A11y

# Browser layer of the a11y/E2E strategy (ADR-0015). Playwright serves a
# production build (E2E base '/') in headless Chromium and runs:
#   - e2e/smoke.spec.ts  — app boots, routes render, no uncaught errors
#   - e2e/a11y.spec.ts   — @axe-core/playwright gate (wcag2a/2aa/21a/21aa)
# Data-agnostic: the specs wait on shell headings, so no data seeding is needed
# (the app fetches the public data repo opportunistically at runtime).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer builds (E2E=1 → base '/') and previews.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
