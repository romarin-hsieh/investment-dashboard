<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Static web application for tracking macro indicators and a stock portfolio"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https:; frame-src https:;"
    />
    <title>Investment Dashboard</title>

    <!--
      The WS-C PR-C4 data prefetch hints were REMOVED with the ADR-0006 amendment
      (2026-08-07): runtime data fetches are now version-keyed (?v=<dataVersion>, see
      src/utils/cacheBust.ts), so a prefetched bare URL can never be reused by the SPA's
      fetch() — the hint had become three wasted requests per load. If prefetch warm-up
      is wanted again, it needs a build step that injects the versioned URLs.
    -->

    <!-- Analytics removed 2026-08-07 (owner decision): Microsoft Clarity session
         recording + Google Analytics ran unconditionally here — never gated by any
         setting, and PRD §5 declares usage metrics "not meaningful for a private
         tool". The state-manager's vestigial clarity_enabled/ga_enabled flags were
         dropped as a follow-up, so there is no longer a toggle to re-wire: the
         Settings privacy statement ("no tracking or analytics") is true because
         nothing loads. Reintroducing any tracker requires updating that statement
         in the same PR. -->

    <script>
      // GitHub Pages SPA routing support
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
